name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using SDK_ROOT=$SDK_ROOT"
          echo "Using sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap telemetry off || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      - name: Ensure Android permissions
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            for (const perm of ["android.permission.CAMERA", "android.permission.RECORD_AUDIO"]) {
              if (!xml.includes(perm)) {
                xml = xml.replace("</manifest>", `    <uses-permission android:name="${perm}" />\n</manifest>`);
              }
            }
            fs.writeFileSync(p, xml);
          '

      - name: Apply Android launcher icon
        run: |
          LOGO="public/assets/aistudio/29d87ee3-5f06-40b0-be78-ca717d4901fe-removebg-preview_676c1b01.png"
          if [ -f "$LOGO" ]; then
            if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
              sudo apt-get update -qq || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq imagemagick || true
            fi
            CMD=$(command -v magick || command -v convert || true)
            if [ -n "$CMD" ]; then
              RES="android/app/src/main/res"
              set_icon() {
                DIR="$RES/mipmap-$1"
                SIZE="$2"
                FG_SIZE="$3"
                FG_INNER="$4"
                mkdir -p "$DIR"
                $CMD "$LOGO" -resize "${SIZE}x${SIZE}" -background transparent -gravity center -extent "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
                $CMD "$LOGO" -resize "${FG_INNER}x${FG_INNER}" -background transparent -gravity center -extent "${FG_SIZE}x${FG_SIZE}" "$DIR/ic_launcher_foreground.png"
              }
              set_icon mdpi 48 108 72
              set_icon hdpi 72 162 108
              set_icon xhdpi 96 216 144
              set_icon xxhdpi 144 324 216
              set_icon xxxhdpi 192 432 288
            fi
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build & Sign Release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ZIPALIGN=$(find "$SDK_ROOT/build-tools" \( -type f -o -type l \) -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_ROOT/build-tools" \( -type f -o -type l \) -name apksigner | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "zipalign or apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          KEYSTORE_FILE="/tmp/notes-release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            ALIAS="${KEY_ALIAS:-notes_release}"
            SPASS="${KEYSTORE_PASS:-NotesRelease2026}"
            KPASS="${KEY_PASS:-$SPASS}"
          else
            ALIAS="notes_release"
            SPASS="NotesRelease2026"
            KPASS="NotesRelease2026"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SPASS" \
              -keypass "$KPASS" \
              -dname "CN=Riyad Islam, OU=Mobile, O=Notes, L=Dhaka, S=Dhaka, C=BD"
          fi

          mkdir -p release-apk
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" /tmp/app-release-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" \
            --key-pass "pass:$KPASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release-apk/Notes.apk \
            /tmp/app-release-aligned.apk

          "$APKSIGNER" verify --verbose release-apk/Notes.apk
          rm -f "$KEYSTORE_FILE" /tmp/app-release-aligned.apk

      - name: Publish Notes.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apk/Notes.apk --clobber
          else
            gh release create "$TAG" release-apk/Notes.apk \
              --title "Notes v1.0.0" \
              --notes "Signed Android Release APK (Notes.apk)" \
              --target "${{ github.sha }}"
          fi
