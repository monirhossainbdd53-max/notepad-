name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap telemetry off || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Ensure Android permissions
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            for (const perm of ["android.permission.CAMERA", "android.permission.RECORD_AUDIO"]) {
              if (!xml.includes(perm)) {
                xml = xml.replace("</manifest>", `    <uses-permission android:name="${perm}" />\n</manifest>`);
              }
            }
            fs.writeFileSync(p, xml);
          '

      - name: Apply Android launcher icon
        run: |
          LOGO="public/assets/aistudio/29d87ee3-5f06-40b0-be78-ca717d4901fe-removebg-preview_676c1b01.png"
          if [ -f "$LOGO" ]; then
            if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq imagemagick
            fi
            CMD=$(command -v magick || command -v convert || true)
            if [ -n "$CMD" ]; then
              RES="android/app/src/main/res"
              set_icon() {
                DIR="$RES/mipmap-$1"
                SIZE="$2"
                FG_SIZE="$3"
                FG_INNER="$4"
                mkdir -p "$DIR"
                $CMD "$LOGO" -resize "${SIZE}x${SIZE}" -background transparent -gravity center -extent "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
                $CMD "$LOGO" -resize "${FG_INNER}x${FG_INNER}" -background transparent -gravity center -extent "${FG_SIZE}x${FG_SIZE}" "$DIR/ic_launcher_foreground.png"
              }
              set_icon mdpi 48 108 72
              set_icon hdpi 72 162 108
              set_icon xhdpi 96 216 144
              set_icon xxhdpi 144 324 216
              set_icon xxxhdpi 192 432 288
            fi
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
