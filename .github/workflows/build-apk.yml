name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Ensure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' "$MANIFEST"
            fi
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application|' "$MANIFEST"
            fi
          fi

      - name: Apply Android launcher icon
        run: |
          LOGO="public/assets/aistudio/29d87ee3-5f06-40b0-be78-ca717d4901fe-removebg-preview_676c1b01.png"
          if [ -f "$LOGO" ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y imagemagick
            fi
            RES="android/app/src/main/res"
            set_icon() {
              DIR="$RES/mipmap-$1"
              SIZE="$2"
              FG_SIZE="$3"
              FG_INNER="$4"
              mkdir -p "$DIR"
              convert "$LOGO" -resize "${SIZE}x${SIZE}" -background transparent -gravity center -extent "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
              cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
              convert "$LOGO" -resize "${FG_INNER}x${FG_INNER}" -background transparent -gravity center -extent "${FG_SIZE}x${FG_SIZE}" "$DIR/ic_launcher_foreground.png"
            }
            set_icon mdpi 48 108 72
            set_icon hdpi 72 162 108
            set_icon xhdpi 96 216 144
            set_icon xxhdpi 144 324 216
            set_icon xxxhdpi 192 432 288
            if [ -f "$RES/values/ic_launcher_background.xml" ]; then
              sed -i 's/#[0-9A-Fa-f]\{6,8\}/#FFFFFF/g' "$RES/values/ic_launcher_background.xml"
            fi
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
